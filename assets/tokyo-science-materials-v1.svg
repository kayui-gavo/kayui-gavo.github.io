<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">东京科学大学理工学系课程资料预览</title>
  <desc id="desc">物理教材、原创模拟试题与面试对策三份实际课程资料的网页展示版式预览。</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0d1824" flood-opacity=".14"/>
    </filter>
    <filter id="shadow2" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="11" stdDeviation="12" flood-color="#0d1824" flood-opacity=".11"/>
    </filter>
    <linearGradient id="bluewash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcecf5"/>
      <stop offset="1" stop-color="#b9d8e9"/>
    </linearGradient>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans CJK JP","Noto Sans SC",sans-serif}
      .serif{font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif CJK JP",serif}
      .navy{fill:#16344f}.blue{fill:#6ca9cf}.muted{fill:#7f8a93}.ink{fill:#17202a}
    </style>
  </defs>

  <!-- subtle baseline -->
  <path d="M70 650H1130" stroke="#1c3347" stroke-opacity=".13"/>
  <text x="70" y="686" class="sans muted" font-size="16" letter-spacing="3.2">TOKYO SCIENCE · COURSE MATERIALS / WEB PREVIEW</text>

  <!-- textbook -->
  <g transform="translate(92 82) rotate(-4 170 250)" filter="url(#shadow)">
    <rect x="0" y="0" width="340" height="500" rx="3" fill="#fff" stroke="#d8dee3"/>
    <path d="M42 98H298M42 174H298" stroke="#88acd0" stroke-width="2"/>
    <text x="264" y="54" text-anchor="end" class="sans blue" font-size="13" letter-spacing="3">２０２６年度　第３版</text>
    <text x="170" y="147" text-anchor="middle" class="serif blue" font-size="33" letter-spacing="4">理系の嶺を超えて</text>
    <text x="170" y="205" text-anchor="middle" class="sans blue" font-size="13">東京科学大学（理工学系）</text>
    <text x="170" y="226" text-anchor="middle" class="sans blue" font-size="12">私費外国人留学生特別選抜　物理対策</text>
    <path d="M79 347c44-17 88-22 138-6 22 7 43 5 61-3-18 13-34 30-46 52-24-18-50-26-78-20-25 5-50-3-75-23z" fill="#27313a" opacity=".78"/>
    <path d="M215 350c31 21 45 53 48 99-23-27-45-42-72-48 10-19 17-36 24-51z" fill="url(#bluewash)" opacity=".9"/>
    <text x="252" y="280" class="sans muted" font-size="12">旅人学堂　劉可惟</text>
    <text x="34" y="474" class="sans muted" font-size="10" letter-spacing="1.7">PHYSICS TEXTBOOK · COVER PREVIEW</text>
  </g>

  <!-- mock exam -->
  <g transform="translate(430 58)" filter="url(#shadow2)">
    <rect x="0" y="0" width="340" height="510" rx="3" fill="#fff" stroke="#d5dadd"/>
    <rect x="28" y="27" width="284" height="3" fill="#183c5a"/>
    <text x="170" y="71" text-anchor="middle" class="sans navy" font-size="15" font-weight="700">旅人学堂 東京科学大学（理工学系）対策講座</text>
    <text x="170" y="112" text-anchor="middle" class="serif ink" font-size="20">令和８年度</text>
    <text x="170" y="142" text-anchor="middle" class="serif ink" font-size="18">私費外国人留学生特別選抜問題</text>
    <text x="170" y="222" text-anchor="middle" class="serif ink" font-size="48" font-weight="700" letter-spacing="22">物 理</text>
    <text x="170" y="264" text-anchor="middle" class="sans navy" font-size="24" font-weight="700">60分</text>
    <path d="M45 308H295" stroke="#1d2c38" stroke-width="1.4"/>
    <text x="46" y="338" class="sans ink" font-size="16" font-weight="700">注意事項</text>
    <text x="47" y="369" class="sans muted" font-size="11">1. 試験開始の合図まで冊子を開かないこと。</text>
    <text x="47" y="391" class="sans muted" font-size="11">2. 問題は3問。すべてに解答すること。</text>
    <text x="47" y="413" class="sans muted" font-size="11">3. 導出過程を含め、日本語で記述すること。</text>
    <text x="286" y="459" text-anchor="end" class="sans navy" font-size="11" font-weight="700">旅人学堂オリジナル問題</text>
    <text x="28" y="489" class="sans muted" font-size="10" letter-spacing="1.7">ORIGINAL MOCK EXAM · COVER PREVIEW</text>
  </g>

  <!-- interview -->
  <g transform="translate(780 88) rotate(4 170 250)" filter="url(#shadow)">
    <rect x="0" y="0" width="340" height="500" rx="3" fill="#fff" stroke="#d8dee3"/>
    <rect x="310" y="0" width="30" height="500" fill="#86b4d6"/>
    <text x="38" y="74" class="sans navy" font-size="12">中国旅人学堂教育集団株式会社</text>
    <text x="38" y="154" class="sans navy" font-size="31" font-weight="800">東京科学大学（理工学系）</text>
    <text x="276" y="194" text-anchor="end" class="sans muted" font-size="21" font-weight="700">— 面接対策 —</text>
    <text x="38" y="257" class="sans ink" font-size="15">中国旅人学堂教育集団株式会社</text>
    <text x="38" y="294" class="sans ink" font-size="14">編集：営業部 / 理系教研組　劉 可惟</text>
    <g transform="translate(227 337)">
      <circle cx="38" cy="38" r="36" fill="#ddecf5"/>
      <circle cx="38" cy="38" r="29" fill="none" stroke="#89b8d6" stroke-width="1.5"/>
      <path d="M38 8v60M8 38h60M17 17l42 42M59 17L17 59" stroke="#8cb9d4" stroke-width="1" opacity=".7"/>
      <circle cx="38" cy="38" r="5" fill="#6da9cf"/>
    </g>
    <text x="38" y="430" class="sans blue" font-size="18" font-weight="700">TABITOから，</text>
    <text x="158" y="430" class="sans navy" font-size="18" font-weight="800">Tokyo Scienceへ</text>
    <text x="34" y="475" class="sans muted" font-size="10" letter-spacing="1.7">INTERVIEW GUIDE · COVER PREVIEW</text>
  </g>
</svg>