name: Fix EJU score notation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-eju-score.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact score wording
        run: python .fix-eju-score.py
      - name: Commit and clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .fix-eju-score.py .github/workflows/fix-eju-score.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git commit -m "fix exact EJU score notation"
          git push
