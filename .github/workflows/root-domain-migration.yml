name: Revert premature root URL migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/root-domain-migration.yml'

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore project-site URLs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = 'https://kayui-gavo.github.io'
          project = 'https://kayui-gavo.github.io/kewei-liu-site'
          new_repo = 'https://github.com/kayui-gavo/kayui-gavo.github.io'
          old_repo = 'https://github.com/kayui-gavo/kewei-liu-site'
          allowed = {'.html', '.xml', '.txt', '.md'}
          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in allowed:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text.replace(new_repo, old_repo)
              # Restore only our site's absolute root URLs, leaving unrelated github.io text alone.
              new = new.replace(root + '/assets/', project + '/assets/')
              new = new.replace(root + '/ja/', project + '/ja/')
              new = new.replace(root + '/zh-cn/', project + '/zh-cn/')
              new = new.replace(root + '/zh-tw/', project + '/zh-tw/')
              new = new.replace(root + '/cv/', project + '/cv/')
              new = new.replace(root + '/sitemap.xml', project + '/sitemap.xml')
              new = new.replace('href="' + root + '/"', 'href="' + project + '/"')
              new = new.replace('content="' + root + '/"', 'content="' + project + '/"')
              new = new.replace('"url":"' + root + '/"', '"url":"' + project + '/"')
              new = new.replace('<loc>' + root + '/</loc>', '<loc>' + project + '/</loc>')
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))
          print('Restored:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit restoration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ja/index.html zh-cn/index.html zh-tw/index.html cv/index.html robots.txt sitemap.xml README.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "restore project-site URLs"
            git push
          fi
