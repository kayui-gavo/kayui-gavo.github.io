name: Root domain migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/root-domain-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace old project-site URLs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'https://kayui-gavo.github.io/kewei-liu-site': 'https://kayui-gavo.github.io',
              'https://github.com/kayui-gavo/kewei-liu-site': 'https://github.com/kayui-gavo/kayui-gavo.github.io',
          }
          allowed = {'.html', '.xml', '.txt', '.md'}
          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in allowed:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, repl in replacements.items():
                  new = new.replace(old, repl)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ja/index.html zh-cn/index.html zh-tw/index.html cv/index.html robots.txt sitemap.xml README.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "migrate site URLs to user root"
            git push
          fi
