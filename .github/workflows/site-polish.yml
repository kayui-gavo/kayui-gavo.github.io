name: Site polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install --quiet pillow pypdf

      - name: Apply site polish
        run: python .site-polish.py

      - name: Generate printable CV PDF
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless --disable-gpu --no-sandbox --allow-file-access-from-files --no-pdf-header-footer --print-to-pdf="$PWD/cv/kewei-liu-cv.pdf" "file://$PWD/cv/index.html"
          python - <<'PY'
          from pypdf import PdfReader
          r=PdfReader('cv/kewei-liu-cv.pdf')
          assert 1 <= len(r.pages) <= 4
          text='\n'.join((p.extract_text() or '') for p in r.pages)
          for x in ['Kewei Liu','Publications','APSIPA','The University of Tokyo']:
              assert x in text, x
          print('CV PDF pages:',len(r.pages))
          PY

      - name: Validate generated site
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.parse('sitemap.xml')
          for f in ['404.html','favicon.ico','assets/favicon.svg','assets/favicon-48.png','assets/apple-touch-icon.png','assets/og-cover.png','cv/kewei-liu-cv.pdf']:
              p=Path(f)
              assert p.is_file() and p.stat().st_size > 0, f
          css=Path('assets/style.css').read_text(encoding='utf-8')
          assert 'data-topic="internships"' not in css
          assert '--gold-text:#87683b' in css and '--rose-text:#a15b5e' in css
          print('Validation passed')
          PY

      - name: Commit polished site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .site-polish.py .github/workflows/site-polish.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git commit -m "polish mobile UX, multilingual copy, SEO and CV"
          git push
