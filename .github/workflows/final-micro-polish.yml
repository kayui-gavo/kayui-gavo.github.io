name: Final micro polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-micro-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final typography and metadata fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          cssp=Path('assets/style.css')
          css=cssp.read_text(encoding='utf-8')
          css=css.replace('color:#948b81;letter-spacing:.01em','color:var(--muted-light);letter-spacing:.01em')
          css=css.replace('color:#978b7b;white-space:nowrap','color:var(--muted-light);white-space:nowrap')
          css=css.replace('  .detail-panel p{font-size:11.4px;line-height:1.68}','  .detail-panel p{font-size:12.2px;line-height:1.7}')
          css=css.replace('outline:2px solid rgba(181,150,96,.6)','outline:2px solid rgba(135,104,59,.72)')
          cssp.write_text(css,encoding='utf-8')

          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          old='<meta name="description" content="Kewei Liu is an M.S. student at The University of Tokyo researching speaking support for Japanese learners, speech and language processing, and multimodal interaction, and works on education R&amp;D and product development.">'
          new='<meta name="description" content="Kewei Liu is an M.S. student at The University of Tokyo studying speech, language, and multimodal interaction for Japanese-language learning, and works on education R&amp;D and product development.">'
          assert old in t
          p.write_text(t.replace(old,new,1),encoding='utf-8')

          assert '#948b81' not in css
          assert '#978b7b' not in css
          assert 'font-size:11.4px;line-height:1.68' not in css
          print('final micro polish passed')
          PY
      - name: Commit and clean up
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/final-micro-polish.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git commit -m "finish typography and metadata polish"
          git push
