name: Concise upcoming internships

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/internship-concise.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply concise upcoming wording
        run: python .internship-concise.py
      - name: Regenerate and verify one-page resume PDF
        shell: bash
        run: |
          python -m pip install --quiet pypdf
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless --disable-gpu --no-sandbox --allow-file-access-from-files --print-to-pdf="$(pwd)/cv/kewei-liu-cv.pdf" "file://$(pwd)/cv/index.html"
          python - <<'PY'
          from pypdf import PdfReader
          r=PdfReader('cv/kewei-liu-cv.pdf')
          assert len(r.pages)==1
          text='\n'.join((p.extract_text() or '') for p in r.pages)
          assert 'Upcoming internships' in text
          assert 'Term 4' not in text
          assert 'Minatomirai' not in text
          print('One-page resume verified')
          PY
      - name: Commit and clean temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .internship-concise.py .github/workflows/internship-concise.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git commit -m "make internship section concise and clearly upcoming"
          git push
