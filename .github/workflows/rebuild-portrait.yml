name: rebuild high-resolution portrait

on:
  push:
    branches: [main]
    paths:
      - 'assets/portrait-data/**'
      - '.github/workflows/rebuild-portrait.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild static portrait
        shell: bash
        run: |
          cat assets/portrait-data/p01.txt assets/portrait-data/p02.txt assets/portrait-data/p03.txt assets/portrait-data/p04.txt assets/portrait-data/p05.txt assets/portrait-data/p06.txt | tr -d '\n\r ' | base64 --decode > assets/portrait.webp
          test -s assets/portrait.webp
          file assets/portrait.webp
      - name: Commit rebuilt portrait
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portrait.webp
          if ! git diff --cached --quiet; then
            git commit -m "restore high-resolution portrait"
            git push
          fi
